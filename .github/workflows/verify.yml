name: Vanish security validation
on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: |
          node --check background.js
          node --check popup.js
          node --check content.js
          node --test tests/security-contract.test.mjs

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned Chromium harness (no repository write token)
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install chromium
      - name: Real unpacked MV3 permission / privacy / hostile DOM / egress test
        run: python tests/browser-acceptance.py
