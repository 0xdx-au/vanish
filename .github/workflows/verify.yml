name: Vanish source verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static source and security contracts
        run: node --test tests/*.test.mjs
      - name: Syntax check
        run: |
          node --check popup.js
          node --check content.js
