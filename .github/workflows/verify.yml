name: Vanish security validation
on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: |
          node --check background.js
          node --check popup.js
          node --check content.js
          node --test tests/security-contract.test.mjs

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Chromium harness (no repository write token)
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool
      - name: Real unpacked MV3 permission / privacy / hostile DOM / egress test
        env:
          VANISH_HEADED: "1"
        run: xvfb-run -a python tests/browser-acceptance.py
      - name: Preserve actual Chrome popup screenshots for design review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vanish-v1.4-popup-visual-qa-${{ github.run_id }}
          path: tests/output/*.png
          if-no-files-found: ignore
          retention-days: 14

  package:
    needs: [source, browser-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Reproducible extension package after passing security gate
        run: python scripts/package_extension.py
      - name: Upload reviewed build candidate (not automatically published)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vanish-v1.4.1-verified-source-${{ github.run_id }}
          path: dist/Vanish-extension-v1.4.1.zip
          if-no-files-found: error
          retention-days: 30
