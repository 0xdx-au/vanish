name: Generate optional promotional assets (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanish-store-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - name: Check out Vanish source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install asset tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-assets.txt
          # Install stable, Playwright-pinned Chromium for a consistent Linux runner target.
          # Download the compatible ubuntu24.04 Linux Chromium+FFmpeg binaries.
          python -m playwright install chromium ffmpeg
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          command -v ffmpeg
          command -v ffprobe
      - name: Render and actually exercise the packaged Vanish picker
        run: python scripts/generate_assets.py
      - name: Package source-consistent installable extension ZIP
        run: |
          python scripts/package_extension.py
          cp dist/Vanish-extension-v*.zip store-assets/
      - name: Assert image formats, dimensions and video duration
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import subprocess,json
          root=Path('store-assets')
          expected={'vanish-logo-96x96.png':(96,96),
                    'store-icon-128x128.png':(128,128),
                    'small-promo-440x280.png':(440,280),
                    'marquee-promo-1400x560.png':(1400,560)}
          for name,sz in expected.items():
              assert Image.open(root/name).size==sz
          assert Image.open(root/'store-icon-128x128.png').getpixel((0,0))[3]==0
          screenshots=list((root/'screenshots').glob('*.png'))
          assert len(screenshots)==4
          for shot in screenshots:
              im=Image.open(shot)
              assert im.size==(1280,800) and im.mode=='RGB'
          meta=json.loads(subprocess.check_output(['ffprobe','-v','quiet','-show_entries','format=duration','-of','json',str(root/'vanish-working-demo-10s.mp4')]))
          assert abs(float(meta['format']['duration'])-10)<.06
          PY
      - name: Upload untrusted build output for reviewed publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vanish-store-and-extension-${{ github.run_id }}
          path: |
            store-assets/
          if-no-files-found: error
          retention-days: 30
